<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Barbearia Jean Carlos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg-dark: #0f0f11; 
            --bg-panel: #18181c; 
            --gold: #d4af37; 
            --gold-hover: #f1c40f;
            --text-light: #f5f5f5; 
            --border: #2a2a30; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 30px 20px; }
        
        h1 { color: var(--gold); margin-bottom: 10px; text-align: center; }
        .box { background: var(--bg-panel); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-light); font-weight: 500; }
        input, select { 
            width: 100%; padding: 14px; background: #222228; border: 1px solid var(--border); 
            color: white; border-radius: 8px; font-size: 1rem; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--gold); outline: none; }
        
        button.btn-submit { 
            width: 100%; padding: 16px; background: var(--gold); color: #000; 
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; 
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        button.btn-submit:hover { background: var(--gold-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #msg-sucesso { display: none; text-align: center; margin-top: 20px; font-weight: bold; color: #2ecc71; padding: 10px; background: rgba(46, 204, 113, 0.1); border-radius: 6px; }
        .voltar { display: block; text-align: center; margin-bottom: 20px; color: var(--gold); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="voltar">← Voltar para o Inicio</a>

        <div class="box">
            <h1>Novo Agendamento</h1>
            <p style="text-align: center; color: #aaa; margin-bottom: 25px;">Preencha os dados abaixo para reservar o seu horário.</p>

            <form id="form-agendamento">
                <div class="form-group">
                    <label for="nome">Seu Nome Completo:</label>
                    <input type="text" id="nome" required placeholder="Ex: João Silva">
                </div>
                <div class="form-group">
                    <label for="servico">Serviço Desejado:</label>
                    <select id="servico" required>
                        <option value="Corte Degradê">Corte Degradê - R$ 35,00</option>
                        <option value="Corte Clássico">Corte Clássico - R$ 30,00</option>
                        <option value="Corte + Barba">Corte + Barba - R$ 55,00</option>
                        <option value="Barboterapia">Barboterapia - R$ 35,00</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label for="hora">Horário:</label>
                    <select id="hora" required>
                        <option value="09:00">09:00</option>
                        <option value="10:00">10:00</option>
                        <option value="11:00">11:00</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                        <option value="17:00">17:00</option>
                    </select>
                </div>
                <button type="submit" id="btn-enviar" class="btn-submit">Confirmar Agendamento</button>
                <div id="msg-sucesso">✅ Agendamento realizado com sucesso!</div>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bmdhqghqcmkahpbtjhva.supabase.co';
        const supabaseKey = 'sb_publishable_qDYi15fCF75MSYywiGdSPw_nfsbKz1Z';
        let supabase;

        window.onload = () => {
            supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('data').setAttribute('min', hoje);
        };

        document.getElementById('form-agendamento').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerText = 'Processando...';

            const nome = document.getElementById('nome').value;
            const servico = document.getElementById('servico').value;
            const data = document.getElementById('data').value;
            const hora = document.getElementById('hora').value;

            const { error } = await supabase
                .from('agendamentos')
                .insert([{ nome, servico, data, hora }]);

            btn.disabled = false;
            btn.innerText = 'Confirmar Agendamento';

            if (error) {
                alert('Erro ao agendar: ' + error.message);
            } else {
                document.getElementById('msg-sucesso').style.display = 'block';
                document.getElementById('form-agendamento').reset();
                setTimeout(() => {
                    document.getElementById('msg-sucesso').style.display = 'none';
                    window.location.href = 'index.html';
                }, 2500);
            }
        });
    </script>
</body>
</html>
