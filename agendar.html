<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Barbearia Jean Carlos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg-dark: #0f0f11; 
            --bg-panel: #18181c; 
            --gold: #d4af37; 
            --gold-hover: #f1c40f;
            --text-light: #f5f5f5; 
            --border: #2a2a30; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 30px 20px; }
        
        h1 { color: var(--gold); margin-bottom: 10px; text-align: center; }
        .box { background: var(--bg-panel); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-light); font-weight: 500; }
        input[type="text"], input[type="date"], select { 
            width: 100%; padding: 14px; background: #222228; border: 1px solid var(--border); 
            color: white; border-radius: 8px; font-size: 1rem;
        }
        
        .services-list { display: flex; flex-direction: column; gap: 10px; }
        .service-option {
            display: flex; align-items: center; justify-content: space-between;
            background: #222228; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border);
            cursor: pointer; transition: 0.2s;
        }
        .service-option:hover { border-color: var(--gold); }
        .service-option input { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; }
        
        .total-box {
            background: #28251e; border: 1px solid var(--gold); padding: 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; margin-top: 15px;
            font-weight: bold; font-size: 1.1rem;
        }

        button.btn-submit { 
            width: 100%; padding: 16px; background: var(--gold); color: #000; 
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; 
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        button.btn-submit:hover { background: var(--gold-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #msg-sucesso { display: none; text-align: center; margin-top: 20px; font-weight: bold; color: #2ecc71; padding: 10px; background: rgba(46, 204, 113, 0.1); border-radius: 6px; }
        .voltar { display: block; text-align: center; margin-bottom: 20px; color: var(--gold); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="voltar">← Voltar para o Início</a>

        <div class="box">
            <h1>Agendar Horário</h1>
            <p style="text-align: center; color: #aaa; margin-bottom: 25px;">Selecione um ou mais serviços desejados.</p>

            <form id="form-agendamento">
                <div class="form-group">
                    <label for="nome">Seu Nome Completo:</label>
                    <input type="text" id="nome" required placeholder="Ex: João Silva">
                </div>

                <div class="form-group">
                    <label>Escolha os Serviços:</label>
                    <div class="services-list">
                        <label class="service-option">
                            <span><input type="checkbox" class="chk-servico" value="Corte Clássico" data-preco="25" onchange="calcularTotal()"> Corte Clássico</span>
                            <strong style="color: var(--gold);">R$ 25,00</strong>
                        </label>
                        <label class="service-option">
                            <span><input type="checkbox" class="chk-servico" value="Corte Degradê" data-preco="30" onchange="calcularTotal()"> Corte Degradê</span>
                            <strong style="color: var(--gold);">R$ 30,00</strong>
                        </label>
                        <label class="service-option">
                            <span><input type="checkbox" class="chk-servico" value="Barba" data-preco="20" onchange="calcularTotal()"> Barba</span>
                            <strong style="color: var(--gold);">R$ 20,00</strong>
                        </label>
                        <label class="service-option">
                            <span><input type="checkbox" class="chk-servico" value="Sobrancelha" data-preco="10" onchange="calcularTotal()"> Sobrancelha</span>
                            <strong style="color: var(--gold);">R$ 10,00</strong>
                        </label>
                    </div>

                    <div class="total-box">
                        <span>Valor Total:</span>
                        <span id="valor-total" style="color: var(--gold);">R$ 0,00</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" required>
                </div>

                <div class="form-group">
                    <label for="hora">Horário:</label>
                    <select id="hora" required>
                        <option value="09:00">09:00</option>
                        <option value="10:00">10:00</option>
                        <option value="11:00">11:00</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                        <option value="17:00">17:00</option>
                        <option value="18:00">18:00</option>
                        <option value="19:00">19:00</option>
                    </select>
                </div>

                <button type="submit" id="btn-enviar" class="btn-submit">Confirmar Agendamento</button>
                <div id="msg-sucesso">✅ Agendamento realizado com sucesso!</div>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bmdhqghqcmkahpbtjhva.supabase.co';
        const supabaseKey = 'sb_publishable_qDYi15fCF75MSYywiGdSPw_nfsbKz1Z';
        let client;

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof supabase !== 'undefined') {
                client = supabase.createClient(supabaseUrl, supabaseKey);
            }
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('data').setAttribute('min', hoje);
        });

        function calcularTotal() {
            let total = 0;
            const checkboxes = document.querySelectorAll('.chk-servico');
            
            checkboxes.forEach(chk => {
                if (chk.checked) {
                    total += parseFloat(chk.getAttribute('data-preco'));
                }
            });
            
            document.getElementById('valor-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        document.getElementById('form-agendamento').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const selecionados = [];
            document.querySelectorAll('.chk-servico:checked').forEach(chk => {
                selecionados.push(chk.value);
            });

            if (selecionados.length === 0) {
                alert('Por favor, selecione pelo menos um serviço antes de continuar.');
                return;
            }

            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerText = 'Agendando...';

            const nome = document.getElementById('nome').value;
            const servico = selecionados.join(' + ');
            const data = document.getElementById('data').value;
            const hora = document.getElementById('hora').value;

            const { error } = await client
                .from('agendamentos')
                .insert([{ nome, servico, data, hora }]);

            btn.disabled = false;
            btn.innerText = 'Confirmar Agendamento';

            if (error) {
                alert('Erro ao realizar o agendamento: ' + error.message);
            } else {
                document.getElementById('msg-sucesso').style.display = 'block';
                document.getElementById('form-agendamento').reset();
                calcularTotal();
                setTimeout(() => {
                    document.getElementById('msg-sucesso').style.display = 'none';
                    window.location.href = 'index.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
