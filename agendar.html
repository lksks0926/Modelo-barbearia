<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Barbearia Jean Carlos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-dark: #0B0B0B; 
            --bg-panel: #151515; 
            --bronze: #A57164; 
            --bronze-hover: #C28878;
            --text-light: #f5f5f5; 
            --ice-white: #E8ECEF;
            --border: #2A2A30; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; font-family: 'Montserrat', sans-serif; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 30px 20px; }
        
        h1 { font-family: 'Cinzel', serif; color: var(--bronze); margin-bottom: 10px; text-align: center; }
        .box { background: var(--bg-panel); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--ice-white); font-weight: 500; }
        input[type="text"], input[type="date"], select { 
            width: 100%; padding: 14px; background: #1C1C1C; border: 1px solid var(--border); 
            color: white; border-radius: 8px; font-size: 1rem; font-family: 'Montserrat', sans-serif;
        }
        
        .services-list { display: flex; flex-direction: column; gap: 10px; }
        .service-option {
            display: flex; align-items: center; justify-content: space-between;
            background: #1C1C1C; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border);
            cursor: pointer; transition: 0.2s; color: var(--ice-white);
        }
        .service-option:hover { border-color: var(--bronze); }
        .service-option input { width: 18px; height: 18px; accent-color: var(--bronze); cursor: pointer; }
        
        .total-box {
            background: #221c1a; border: 1px solid var(--bronze); padding: 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; margin-top: 15px;
            font-weight: bold; font-size: 1.1rem; color: var(--ice-white);
        }

        button.btn-submit { 
            width: 100%; padding: 16px; background: var(--bronze); color: #fff; 
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; 
            cursor: pointer; transition: 0.3s; margin-top: 20px; font-family: 'Montserrat', sans-serif;
        }
        button.btn-submit:hover { background: var(--bronze-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #msg-sucesso { display: none; text-align: center; margin-top: 20px; font-weight: bold; color: #2ecc71; padding: 10px; background: rgba(46, 204, 113, 0.1); border-radius: 6px; }
        #msg-aviso-data { color: #e74c3c; font-size: 0.85rem; margin-top: 5px; display: none; }
        .voltar { display: block; text-align: center; margin-bottom: 20px; color: var(--bronze); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="voltar">← Voltar para o Início</a>

        <div class="box">
            <h1>Agendar Horário</h1>
            <p style="text-align: center; color: var(--ice-white); margin-bottom: 25px;">Selecione um ou mais serviços desejados.</p>

            <form id="form-agendamento">
                <div class="form-group">
                    <label for="nome">Seu Nome Completo:</label>
                    <input type="text" id="nome" required placeholder="Ex: João Silva">
                </div>

                <div class="form-group">
                    <label>Escolha os Serviços:</label>
                    <div class="services-list">
                        <label class="service-option">
                            <span><input type="checkbox" class="chk-servico" value="Corte Clássico" data-preco="25" onchange="calcularTotal()"> Corte Clássico</span>
                            <strong style="color: var(--bronze); font-family: 'Cinzel', serif;">R$ 25,00</strong>
                        </label>
                        <label class="service-option">
                            <span><input type="checkbox" class="chk-servico" value="Corte Degradê" data-preco="30" onchange="calcularTotal()"> Corte Degradê</span>
                            <strong style="color: var(--bronze); font-family: 'Cinzel', serif;">R$ 30,00</strong>
                        </label>
                        <label class="service-option">
                            <span><input type="checkbox" class="chk-servico" value="Barba" data-preco="20" onchange="calcularTotal()"> Barba</span>
                            <strong style="color: var(--bronze); font-family: 'Cinzel', serif;">R$ 20,00</strong>
                        </label>
                        <label class="service-option">
                            <span><input type="checkbox" class="chk-servico" value="Sobrancelha" data-preco="10" onchange="calcularTotal()"> Sobrancelha</span>
                            <strong style="color: var(--bronze); font-family: 'Cinzel', serif;">R$ 10,00</strong>
                        </label>
                    </div>

                    <div class="total-box">
                        <span>Valor Total:</span>
                        <span id="valor-total" style="color: var(--bronze); font-family: 'Cinzel', serif;">R$ 0,00</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" required onchange="validarEBuscarHorarios()">
                    <div id="msg-aviso-data">Domingos não abrimos. Por favor, escolha outra data!</div>
                </div>

                <div class="form-group">
                    <label for="hora">Horário Disponível:</label>
                    <select id="hora" required disabled>
                        <option value="">Selecione uma data primeiro</option>
                    </select>
                </div>

                <button type="submit" id="btn-enviar" class="btn-submit">Confirmar Agendamento</button>
                <div id="msg-sucesso">✅ Agendamento realizado com sucesso!</div>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bmdhqghqcmkahpbtjhva.supabase.co';
        const supabaseKey = 'sb_publishable_qDYi15fCF75MSYywiGdSPw_nfsbKz1Z';
        let client;

        const todosHorarios = ["09:00", "10:00", "11:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof supabase !== 'undefined') {
                client = supabase.createClient(supabaseUrl, supabaseKey);
            }
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('data').setAttribute('min', hoje);
        });

        function calcularTotal() {
            let total = 0;
            document.querySelectorAll('.chk-servico:checked').forEach(chk => {
                total += parseFloat(chk.getAttribute('data-preco'));
            });
            document.getElementById('valor-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        async function validarEBuscarHorarios() {
            const inputData = document.getElementById('data');
            const selectHora = document.getElementById('hora');
            const msgAviso = document.getElementById('msg-aviso-data');
            const dataSelecionada = inputData.value;

            if (!dataSelecionada) return;

            // 1. Bloqueio de Domingo
            const partes = dataSelecionada.split('-');
            const dataObjeto = new Date(partes[0], partes[1] - 1, partes[2]);
            if (dataObjeto.getDay() === 0) { 
                msgAviso.style.display = 'block';
                inputData.value = '';
                selectHora.innerHTML = '<option value="">Selecione uma data primeiro</option>';
                selectHora.disabled = true;
                return;
            } else {
                msgAviso.style.display = 'none';
            }

            selectHora.disabled = true;
            selectHora.innerHTML = '<option value="">Carregando horários vagos...</option>';

            // 2. Verificar bloqueio manual do admin
            const { data: bloqueios } = await client
                .from('bloqueios')
                .select('*')
                .eq('data', dataSelecionada);

            if (bloqueios && bloqueios.length > 0) {
                alert('A barbearia não funcionará nesta data por motivo de folga/feriado.');
                inputData.value = '';
                selectHora.innerHTML = '<option value="">Selecione outra data</option>';
                return;
            }

            // 3. Buscar horários já ocupados no Supabase
            const { data: agendamentos } = await client
                .from('agendamentos')
                .select('hora')
                .eq('data', dataSelecionada);

            const ocupados = agendamentos ? agendamentos.map(a => a.hora) : [];

            // 4. Filtrar por disponibilidade no BD
            let livres = todosHorarios.filter(h => !ocupados.includes(h));

            // 5. Validação de horário no dia atual (remove passados e com menos de 15 min)
            const agora = new Date();
            const anoAtual = agora.getFullYear();
            const mesAtual = String(agora.getMonth() + 1).padStart(2, '0');
            const diaAtual = String(agora.getDate()).padStart(2, '0');
            const hojeFormatado = `${anoAtual}-${mesAtual}-${diaAtual}`;

            if (dataSelecionada === hojeFormatado) {
                const minutosAtuais = (agora.getHours() * 60) + agora.getMinutes();

                livres = livres.filter(h => {
                    const [hHora, hMin] = h.split(':').map(Number);
                    const minutosDoHorario = (hHora * 60) + hMin;
                    
                    // Exige que faltem no mínimo 15 minutos para o horário
                    return (minutosDoHorario - minutosAtuais) >= 15;
                });
            }

            // Renderizar opções de horário no select
            selectHora.innerHTML = '';
            if (livres.length === 0) {
                selectHora.innerHTML = '<option value="">Nenhum horário disponível para esta data</option>';
            } else {
                selectHora.innerHTML = '<option value="">Escolha um horário</option>';
                livres.forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h;
                    opt.innerText = h;
                    selectHora.appendChild(opt);
                });
                selectHora.disabled = false;
            }
        }

        document.getElementById('form-agendamento').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const selecionados = [];
            document.querySelectorAll('.chk-servico:checked').forEach(chk => {
                selecionados.push(chk.value);
            });

            if (selecionados.length === 0) {
                alert('Por favor, selecione pelo menos um serviço antes de continuar.');
                return;
            }

            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerText = 'Agendando...';

            const nome = document.getElementById('nome').value;
            const servico = selecionados.join(' + ');
            const data = document.getElementById('data').value;
            const hora = document.getElementById('hora').value;

            const { error } = await client
                .from('agendamentos')
                .insert([{ nome, servico, data, hora }]);

            btn.disabled = false;
            btn.innerText = 'Confirmar Agendamento';

            if (error) {
                alert('Erro ao realizar o agendamento: ' + error.message);
            } else {
                document.getElementById('msg-sucesso').style.display = 'block';
                document.getElementById('form-agendamento').reset();
                calcularTotal();
                setTimeout(() => {
                    document.getElementById('msg-sucesso').style.display = 'none';
                    window.location.href = 'index.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
