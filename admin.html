<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Barbearia</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg-dark: #0f0f11; 
            --bg-panel: #18181c; 
            --gold: #d4af37; 
            --gold-hover: #f1c40f;
            --text-light: #f5f5f5; 
            --border: #2a2a30; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        
        h1, h2 { color: var(--gold); margin-bottom: 20px; text-align: center; }
        .box { background: var(--bg-panel); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-light); }
        input { width: 100%; padding: 12px; background: #222228; border: 1px solid var(--border); color: white; border-radius: 6px; }
        
        button.btn-submit { width: 100%; padding: 14px; background: var(--gold); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-sair { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .agendamento-item { background: #222228; padding: 18px; border-radius: 8px; border-left: 4px solid var(--gold); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .agendamento-info h4 { color: #fff; font-size: 1.1rem; }
        
        #view-login, #view-admin { display: none; }
        #msg-erro-login { display: none; text-align: center; margin-top: 15px; color: #e74c3c; font-weight: bold; }
        
        .voltar-site { text-align: center; margin-top: 20px; }
        .voltar-site a { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="view-login">
            <div class="box" style="max-width: 400px; margin: 40px auto;">
                <h2>Painel Restrito</h2>
                <p style="text-align: center; color: #aaa; margin-bottom: 20px;">Digite suas credenciais de administrador.</p>
                <form id="form-login">
                    <div class="form-group">
                        <label>E-mail:</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Senha:</label>
                        <input type="password" id="login-senha" required>
                    </div>
                    <button type="submit" id="btn-login" class="btn-submit">Entrar</button>
                    <div id="msg-erro-login">E-mail ou senha incorretos.</div>
                </form>
                <div class="voltar-site">
                    <a href="index.html">← Voltar para o Site</a>
                </div>
            </div>
        </div>

        <!-- PAINEL ADMINISTRATIVO -->
        <div id="view-admin">
            <div class="admin-header">
                <h1>Agenda do Dia</h1>
                <button onclick="fazerLogout()" class="btn-sair">Sair</button>
            </div>
            <div class="box">
                <div id="lista-agendamentos">
                    <p style="color: #aaa; text-align: center;">Carregando agendamentos...</p>
                </div>
            </div>
            <div class="voltar-site">
                <a href="index.html">← Ir para o site público</a>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bmdhqghqcmkahpbtjhva.supabase.co';
        const supabaseKey = 'sb_publishable_qDYi15fCF75MSYywiGdSPw_nfsbKz1Z';
        let supabase;

        window.onload = async () => {
            supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            await verificarSessao();
        };

        async function verificarSessao() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    document.getElementById('view-login').style.display = 'none';
                    document.getElementById('view-admin').style.display = 'block';
                    carregarAgendamentos();
                } else {
                    document.getElementById('view-admin').style.display = 'none';
                    document.getElementById('view-login').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('view-login').style.display = 'block';
            }
        }

        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.innerText = 'Autenticando...';
            document.getElementById('msg-erro-login').style.display = 'none';

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-senha').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            btn.disabled = false;
            btn.innerText = 'Entrar';

            if (error) {
                document.getElementById('msg-erro-login').innerText = 'Erro: ' + error.message;
                document.getElementById('msg-erro-login').style.display = 'block';
            } else {
                verificarSessao();
            }
        });

        async function fazerLogout() {
            await supabase.auth.signOut();
            verificarSessao();
        }

        async function carregarAgendamentos() {
            const listaDiv = document.getElementById('lista-agendamentos');
            listaDiv.innerHTML = '<p style="color: #aaa; text-align: center;">Buscando agendamentos...</p>';

            const { data, error } = await supabase
                .from('agendamentos')
                .select('*')
                .order('data', { ascending: true })
                .order('hora', { ascending: true });

            if (error) {
                listaDiv.innerHTML = `<p style="color: #e74c3c;">Erro ao carregar: ${error.message}</p>`;
                return;
            }

            listaDiv.innerHTML = '';

            if (data.length === 0) {
                listaDiv.innerHTML = '<p style="color: #aaa; text-align: center;">Nenhum agendamento cadastrado.</p>';
                return;
            }

            data.forEach(item => {
                const dataFormatada = item.data.split('-').reverse().join('/');
                const div = document.createElement('div');
                div.className = 'agendamento-item';
                div.innerHTML = `
                    <div class="agendamento-info">
                        <h4>${item.nome}</h4>
                        <p style="color: var(--gold); font-weight: bold;">${item.servico}</p>
                        <p style="color: #aaa; font-size: 0.9rem;">📅 ${dataFormatada} às ⏰ ${item.hora}</p>
                    </div>
                    <button onclick="removerAgendamento('${item.id}')" style="background: #e74c3c; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer;">Concluir</button>
                `;
                listaDiv.appendChild(div);
            });
        }

        async function removerAgendamento(id) {
            if(!confirm("Concluir ou cancelar este agendamento?")) return;
            const { error } = await supabase.from('agendamentos').delete().eq('id', id);
            if (error) alert('Erro: ' + error.message);
            else carregarAgendamentos();
        }
    </script>
</body>
</html>
