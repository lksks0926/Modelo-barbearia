<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Barbearia</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg-dark: #0f0f11; 
            --bg-panel: #18181c; 
            --gold: #d4af37; 
            --text-light: #f5f5f5; 
            --border: #2a2a30; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        .box { background: var(--bg-panel); padding: 30px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        h1, h2, h3 { color: var(--gold); text-align: center; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #222228; border: 1px solid var(--border); color: white; border-radius: 6px; }
        
        button.btn-submit { width: 100%; padding: 14px; background: var(--gold); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-sair { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .agendamento-item { 
            background: #222228; padding: 18px; border-radius: 8px; border-left: 4px solid var(--gold); 
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; 
        }

        .bloqueio-item {
            background: #2b1f1f; padding: 12px 15px; border-radius: 6px; border-left: 4px solid #e74c3c;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        
        #view-loading { text-align: center; padding: 40px; color: #aaa; }
        #view-login { display: none; }
        #view-admin { display: none; }
        #msg-erro { display: none; text-align: center; margin-top: 15px; color: #e74c3c; font-weight: bold; }
        
        .voltar-site { text-align: center; margin-top: 20px; }
        .voltar-site a { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="view-loading" class="box">
            <p>Conectando ao painel...</p>
        </div>

        <!-- TELA DE LOGIN -->
        <div id="view-login">
            <div class="box" style="max-width: 400px; margin: 20px auto;">
                <h2>Acesso Restrito</h2>
                <p style="text-align: center; color: #aaa; margin-bottom: 20px;">Entre com suas credenciais de admin.</p>
                <form id="form-login">
                    <div class="form-group">
                        <label>E-mail:</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Senha:</label>
                        <input type="password" id="login-senha" required>
                    </div>
                    <button type="submit" id="btn-login" class="btn-submit">Entrar</button>
                    <div id="msg-erro"></div>
                </form>
                <div class="voltar-site">
                    <a href="index.html">← Voltar para o Site</a>
                </div>
            </div>
        </div>

        <!-- TELA DO PAINEL ADMIN -->
        <div id="view-admin">
            <div class="admin-header">
                <h1>Painel do Barbeiro</h1>
                <button onclick="fazerLogout()" class="btn-sair">Sair</button>
            </div>

            <!-- BLOQUEIO DE DATAS -->
            <div class="box">
                <h3 style="text-align: left; margin-bottom: 10px;">🚫 Bloquear Dia / Folga</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="date" id="data-bloqueio" style="flex: 1;">
                    <button onclick="bloquearData()" style="padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Bloquear Data</button>
                </div>
                <div id="lista-bloqueios"></div>
            </div>

            <!-- LISTA DE AGENDAMENTOS -->
            <div class="box">
                <h3 style="text-align: left; margin-bottom: 15px;">📅 Próximos Agendamentos</h3>
                <div id="lista-agendamentos">
                    <p style="color: #aaa; text-align: center;">Carregando dados da agenda...</p>
                </div>
            </div>

            <div class="voltar-site">
                <a href="index.html">← Ir para o site público</a>
            </div>
        </div>

    </div>

    <script>
        const supabaseUrl = 'https://bmdhqghqcmkahpbtjhva.supabase.co';
        const supabaseKey = 'sb_publishable_qDYi15fCF75MSYywiGdSPw_nfsbKz1Z';
        let client;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof supabase === 'undefined') throw new Error("Supabase não carregado");
                client = supabase.createClient(supabaseUrl, supabaseKey);
                await checarSessao();
            } catch (err) {
                document.getElementById('view-loading').innerHTML = `<p style="color:#e74c3c;">Erro: ${err.message}</p>`;
            }
        });

        async function checarSessao() {
            document.getElementById('view-loading').style.display = 'none';
            const { data: { session } } = await client.auth.getSession();

            if (session) {
                document.getElementById('view-login').style.display = 'none';
                document.getElementById('view-admin').style.display = 'block';
                carregarAgendamentos();
                carregarBloqueios();
            } else {
                document.getElementById('view-admin').style.display = 'none';
                document.getElementById('view-login').style.display = 'block';
            }
        }

        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.disabled = true; btn.innerText = 'Autenticando...';

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-senha').value;

            const { error } = await client.auth.signInWithPassword({ email, password });
            btn.disabled = false; btn.innerText = 'Entrar';

            if (error) {
                document.getElementById('msg-erro').innerText = error.message;
                document.getElementById('msg-erro').style.display = 'block';
            } else {
                checarSessao();
            }
        });

        async function fazerLogout() {
            await client.auth.signOut();
            checarSessao();
        }

        async function carregarAgendamentos() {
            const listaDiv = document.getElementById('lista-agendamentos');
            const { data, error } = await client.from('agendamentos').select('*').order('data', { ascending: true }).order('hora', { ascending: true });

            if (error || !data || data.length === 0) {
                listaDiv.innerHTML = '<p style="color: #aaa; text-align: center;">Nenhum agendamento encontrado.</p>';
                return;
            }

            listaDiv.innerHTML = '';
            data.forEach(item => {
                const dataFormatada = item.data.split('-').reverse().join('/');
                const div = document.createElement('div');
                div.className = 'agendamento-item';
                div.innerHTML = `
                    <div>
                        <h4 style="color:#fff;">${item.nome}</h4>
                        <p style="color: var(--gold); font-weight: bold;">${item.servico}</p>
                        <p style="color: #aaa; font-size: 0.85rem;">📅 ${dataFormatada} às ⏰ ${item.hora}</p>
                    </div>
                    <button onclick="removerAgendamento('${item.id}')" style="background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer;">Concluir</button>
                `;
                listaDiv.appendChild(div);
            });
        }

        async function removerAgendamento(id) {
            if(!confirm("Concluir agendamento?")) return;
            await client.from('agendamentos').delete().eq('id', id);
            carregarAgendamentos();
        }

        /* --- LÓGICA DE BLOQUEIOS DE DATA --- */
        async function bloquearData() {
            const dataInput = document.getElementById('data-bloqueio').value;
            if(!dataInput) return alert('Selecione uma data para bloquear.');

            const { error } = await client.from('bloqueios').insert([{ data: dataInput }]);
            if (error) alert('Data já está bloqueada ou ocorreu um erro.');
            else {
                document.getElementById('data-bloqueio').value = '';
                carregarBloqueios();
            }
        }

        async function carregarBloqueios() {
            const listaDiv = document.getElementById('lista-bloqueios');
            const { data } = await client.from('bloqueios').select('*').order('data', { ascending: true });

            if (!data || data.length === 0) {
                listaDiv.innerHTML = '<p style="color: #666; font-size: 0.85rem;">Nenhum dia bloqueado manualmente.</p>';
                return;
            }

            listaDiv.innerHTML = '<p style="color: #aaa; font-size: 0.85rem; margin-bottom: 5px;">Dias Fechados/Folgas:</p>';
            data.forEach(item => {
                const dataFormatada = item.data.split('-').reverse().join('/');
                const div = document.createElement('div');
                div.className = 'bloqueio-item';
                div.innerHTML = `
                    <span>🚫 ${dataFormatada}</span>
                    <button onclick="desbloquearData('${item.id}')" style="background: transparent; color: #aaa; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; cursor: pointer;">Desbloquear</button>
                `;
                listaDiv.appendChild(div);
            });
        }

        async function desbloquearData(id) {
            await client.from('bloqueios').delete().eq('id', id);
            carregarBloqueios();
        }
    </script>
</body>
</html>
